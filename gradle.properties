# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Optimization for faster builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Fix for Daemon compilation issues
# Increased memory and added more opens for compatibility with KSP/Kotlin 2.0
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED
kapt.use.worker.api=true
kotlin.incremental=true
