<style>
        .glass-gradient {
            background: linear-gradient(135deg, #2170e4 0%, #adc6ff 100%);
        }
        .soft-glow {
            box-shadow: 0 0 50px 10px rgba(59, 130, 246, 0.15);
        }
        .logo-scale {
            transform: scale(1.15);
        }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background font-body-md text-on-background overflow-hidden h-screen w-screen flex items-center justify-center">

<div class="relative w-full h-full flex items-center justify-center overflow-hidden">

<div class="absolute inset-0 z-0 opacity-10" data-alt="Smooth gradient flowing from deep vibrant blue to soft light azure with subtle grain texture for a clean interface">
<div class="w-full h-full glass-gradient"></div>
</div>

<div class="absolute top-[10%] -left-20 w-80 h-80 bg-primary/5 rounded-full blur-[80px]"></div>
<div class="absolute bottom-[10%] -right-20 w-96 h-96 bg-primary-fixed-dim/10 rounded-full blur-[100px]"></div>

<div class="relative z-10 flex flex-col items-center justify-center">

<div class="relative mb-lg group">

<div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full scale-150"></div>
<!-- Logo Container -->
<div class="relative w-28 h-28 glass-gradient rounded-[32px] flex items-center justify-center shadow-[0_20px_40px_rgba(33,112,228,0.3)] logo-scale border border-white/30 backdrop-blur-sm">

                        auto_awesome
                    </span>
</div>
</div>

<div class="text-center">
<h1 class="font-h1 text-h1 text-primary-container tracking-tighter mb-xs">

                </h1>
<p class="font-label-caps text-label-caps text-outline uppercase tracking-[0.2em] opacity-60">
                    Futuristic Serenity
                </p>
</div>
</div>

<div class="absolute bottom-12 flex flex-col items-center gap-sm">
<div class="flex gap-1.5">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary/40"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary/20"></div>
</div>
<span class="font-label-bold text-label-bold text-secondary/40">
