<!DOCTYPE html>

<html class="light" lang="en"><head>

                    "on-tertiary-fixed": "#311400",
                    "surface-container": "#ecedf7",
                    "primary-fixed": "#d8e2ff",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#e1e2ec",

                    "surface-dim": "#d8d9e3",

                    "inverse-surface": "#2e3038",
                    "on-primary-fixed-variant": "#004395",
                    "on-surface": "#191b23",

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 60px rgba(59, 130, 246, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Decor -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute top-[40%] -right-[5%] w-[40%] h-[50%] rounded-full bg-primary-container/5 blur-[100px]"></div>
</div>
<!-- Main Login Container -->
<main class="w-full max-w-[400px] px-margin-edge z-10">
<!-- Brand Identity -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-[22px] bg-primary-container mb-md shadow-[0_8px_24px_rgba(33,112,228,0.25)]">
<span class="material-symbols-outlined text-white text-[32px]" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-h1 text-h1 text-on-background tracking-tighter mb-xs">ChatSnap</h1>
<p class="font-body-md text-secondary text-body-md">Connect instantly, share fluidly.</p>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-[32px] p-lg">
<form action="#" class="space-y-md" method="POST">
<!-- Field: Email/Phone -->
<div class="space-y-base">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-sm">Email or Phone</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" data-icon="alternate_email">alternate_email</span>
</div>
<input class="w-full bg-secondary-container/30 border-none rounded-xl py-[14px] pl-[44px] pr-md font-body-md text-on-surface focus:ring-2 focus:ring-primary/20 transition-all duration-200 outline-none" placeholder="snapuser@example.com" type="text"/>
</div>
</div>
<!-- Field: Password -->
<div class="space-y-base">
<div class="flex justify-between items-center px-sm">
<label class="font-label-bold text-label-bold text-on-surface-variant">Password</label>
<a class="font-label-bold text-label-bold text-primary hover:opacity-80 transition-opacity" href="#">Forgot?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full bg-secondary-container/30 border-none rounded-xl py-[14px] pl-[44px] pr-[44px] font-body-md text-on-surface focus:ring-2 focus:ring-primary/20 transition-all duration-200 outline-none" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Log In Button -->
<div class="pt-base">
<button class="w-full bg-primary-container text-white font-label-bold text-body-lg py-md rounded-xl shadow-[0_12px_24px_rgba(33,112,228,0.2)] active:scale-95 transition-all duration-200 flex items-center justify-center gap-sm" type="submit">
                        Log In
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="relative py-lg">
<div class="absolute inset-0 flex items-center px-lg">
<div class="w-full border-t border-secondary-container"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-white/20 px-sm font-label-caps text-label-caps text-secondary">OR CONTINUE WITH</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm bg-white border border-secondary-container rounded-xl py-sm font-label-bold text-on-surface hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<img alt="Google" class="w-5 h-5" data-alt="Google colorful logo icon on a clean white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFGPB50mxM5X9nyTCq68gTmB767aJ_uZbuy_6Lxr6lJHGN-zGbnqk5gJB-_dvPkoVb4q-macIftZ7N8ZEsQjOi-pchw1zlY5Av-TCwXLg5epCn-rHThTebF8lVOuD6Mys9bZd3IYVpaypIDk35sCvAmtggIJEjaA_ixPWphlPrCG5nD4RKyFUscCjSGWg5AsDBntwEIXoYgjqg9_onqOh1cjgtOZsoMzxHmB_-Wf0f3xesn72jcJQctYh5d_8lkgsOoSinwxHSCRQ"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-sm bg-white border border-secondary-container rounded-xl py-sm font-label-bold text-on-surface hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-black text-[20px]" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
                    Apple
                </button>
</div>
</div>
<!-- Footnote -->
<div class="text-center mt-lg">
<p class="font-body-md text-secondary">
                New to ChatSnap? 
                <a class="font-label-bold text-primary hover:underline ml-xs" href="#">Create an account</a>
</p>
</div>
</main>
<!-- Content-exclusive Footer -->
<footer class="mt-xl text-center pb-lg z-10">
<nav class="flex justify-center gap-lg">
<a class="font-label-caps text-label-caps text-outline hover:text-primary transition-colors" href="#">Privacy</a>
<a class="font-label-caps text-label-caps text-outline hover:text-primary transition-colors" href="#">Terms</a>
<a class="font-label-caps text-label-caps text-outline hover:text-primary transition-colors" href="#">Help</a>
</nav>
</footer>
</body></html>
